[project]
name = "arcane-engine-sim"
version = "0.1.0"
description = "Stateful Docker/Podman engine API simulator (drift-faithful) for arcane-podman gates."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
]

[project.scripts]
engine-sim = "engine_sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine_sim"]

# Ship the captured fixtures inside the package.
[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "engine_sim/fixtures"
